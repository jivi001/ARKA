name: ARKA Rust CI & Quality Gates

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

# Minimal global permissions (INV-010 Fail-closed / Principle of Least Privilege)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-format:
    name: Rust Format (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Verify Formatting
        run: cargo fmt --check

  rust-clippy:
    name: Rust Lints (clippy -D warnings)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy Linter
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust Security Kernel Test Suite
    runs-on: ubuntu-latest
    needs: [rust-format, rust-clippy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Workspace Tests
        run: cargo test --all --verbose
