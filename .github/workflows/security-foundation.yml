name: ARKA P0 Security Foundation & Supply Chain Gates

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

# Minimal global permissions (INV-010 Fail-closed / Principle of Least Privilege)
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-sec-model:
    name: CI-SEC-MODEL (Threat Model & Referential Integrity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema cryptography

      - name: Validate Threat Model Schemas & Integrity
        run: |
          python security/validator/validate_security_model.py

  ci-sec-traceability:
    name: CI-SEC-TRACEABILITY (Controls & Acceptance Matrix)
    runs-on: ubuntu-latest
    needs: [ci-sec-model]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema

      - name: Validate Traceability Matrix & Control Coverage
        run: |
          python security/validator/validate_security_model.py --check-traceability

  ci-sec-validator:
    name: CI-SEC-VALIDATOR (Validator Meta-Tests & Crypto Contracts)
    runs-on: ubuntu-latest
    needs: [ci-sec-model]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema cryptography pytest

      - name: Execute Validator Negative Meta-Tests
        run: |
          python security/validator/validate_security_model.py --meta-tests

      - name: Execute Cryptographic Key Provider Test Suite
        run: |
          python -m unittest tests/security/test_key_provider.py

  ci-sec-secrets:
    name: CI-SEC-SECRETS (Gitleaks Secret Scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-sec-dependencies:
    name: CI-SEC-DEPENDENCIES (pip-audit & pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Run pip-audit on Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20'

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate

      - name: Run pnpm audit on Frontend dependencies
        working-directory: ./frontend
        run: |
          pnpm audit --prod --audit-level=high

  ci-sec-sbom:
    name: CI-SEC-SBOM (CycloneDX SBOM Generation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Generate CycloneDX Python SBOM
        run: |
          python -m pip install --upgrade pip
          pip install cyclonedx-bom
          cyclonedx-py environment -o sbom-arka-python.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-arka-python
          path: sbom-arka-python.json
          retention-days: 14
