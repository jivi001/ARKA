[workspace]
resolver = "2"
members = [
    "crates/arka-core-types",
    "crates/arka-crypto",
    "crates/arka-kernel",
    "crates/arka-storage-sqlite",
    "crates/arka-worker-protocol",
    "crates/arka-execution-broker",
    "crates/arka-network-policy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["ARKA Security Engineering Team"]
license = "Proprietary"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom", "std"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1.8", features = ["v4", "serde"] }
url = "2.5"
