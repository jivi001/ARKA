version: "1.0.0"
policy_name: "ARKA Cryptographic Key Management & Domain Separation Policy"

key_domains:
  - domain_id: "ROOT-ANCHOR"
    name: "Master Cryptographic Root Anchor"
    purpose: "Authoritative root of trust for issuing subsystem intermediate keys and verifying platform binary signatures."
    algorithm: "Ed25519 / RSA-4096 (Production HSM) or Ed25519 (Development)"
    storage_location: "Hardware Security Module (HSM) / FIPS 140-3 Level 3 enclave (Air-gapped offline in Production; ephemeral in-memory in Dev)."
    access_authority: "Quorum of Platform Security Administrators (M-of-N ceremony)."
    generation: "Generated during formal key ceremony within hardware enclave using hardware TRNG."
    rotation_policy: "Annual key ceremony or immediately upon cryptographic deprecation / compromise."
    compromise_response: "Immediate platform freeze, revocation certificate publication to Transparency Log, and full re-keying ceremony."
    destruction: "Zeroization of hardware enclave storage via crypto-erase protocol."

  - domain_id: "TOKEN-SIGNING"
    name: "Authorization and Capability Token Signing Key"
    purpose: "Issues cryptographically verifiable, ephemeral capability and authorization tokens (INV-002, INV-011)."
    algorithm: "Ed25519"
    storage_location: "Deterministic Rust Security Kernel protected memory; sealed within kernel process space (never exported)."
    access_authority: "Authoritative Rust Security Kernel process exclusively."
    generation: "Generated at Kernel initialization from master seed or KMS enclave."
    rotation_policy: "Every 24 hours automatically; active tokens expire within 15 minutes."
    compromise_response: "Kernel revokes active kid, terminates running capability sessions, and rolls forward to new key pair."
    destruction: "Cryptographic memory wipe using zeroize crate on process shutdown."

  - domain_id: "AUDIT-SIGNING"
    name: "Immutable Audit Log Event Signing Key"
    purpose: "Signs serialized canonical audit events and hash-chain blocks to guarantee non-repudiation (INV-012)."
    algorithm: "Ed25519"
    storage_location: "Dedicated Audit Service signing enclave, isolated from agent execution plane and target workers."
    access_authority: "COMP-AUDIT service exclusively."
    generation: "Generated at audit subsystem initialization."
    rotation_policy: "Every 30 days or per audit epoch."
    compromise_response: "Audit epoch closure, anchor head-hash to external timestamp authority, and initialize fresh audit epoch."
    destruction: "Secure erasure of private key once epoch transition is anchored to external transparency log."

  - domain_id: "CREDENTIAL-KEK"
    name: "Credential Vault Key Encryption Key"
    purpose: "Envelopes and encrypts sensitive target credentials (passwords, SSH keys, API tokens) at rest."
    algorithm: "AES-256-GCM"
    storage_location: "OS-backed secure store (Linux secret service / Keyring) or Cloud KMS (AWS KMS / GCP Cloud KMS / Vault)."
    access_authority: "COMP-CRED (Credential Broker) exclusively; never exposed to LLM or worker containers."
    generation: "Generated using CSPRNG in KMS/OS keystore."
    rotation_policy: "90-day rotation; old keys retained in decrypt-only mode for historical re-encryption."
    compromise_response: "Immediate revocation of all target sessions, rotation of target credentials on endpoints, and re-encryption of vault under new KEK."
    destruction: "Cryptographic deletion of KMS key version and shredding of decrypted memory buffers."

  - domain_id: "MISSION-DATA-ENCRYPTION"
    name: "Mission & Evidence Data Encryption Keys"
    purpose: "Encrypts raw target evidence, attack surface findings, and mission artifacts per-mission at rest."
    algorithm: "AES-256-GCM"
    storage_location: "Evidence store database and filesystem envelope."
    access_authority: "COMP-EVID pipeline and authenticated mission operators."
    generation: "Generated dynamically per mission by Credential Broker / Kernel."
    rotation_policy: "Rotated per mission lifecycle (new DEK per mission); archived with mission completion."
    compromise_response: "Mission termination, isolation of mission evidence storage volume, and operator security advisory."
    destruction: "Shredding of mission DEK upon retention policy expiration or GDPR/right-to-erasure request."

  - domain_id: "WORKER-IDENTITY"
    name: "Sandbox Worker Identity and mTLS Keypair"
    purpose: "Mutual TLS authentication and process identity verification between sandboxed workers and execution broker."
    algorithm: "Ed25519 / TLS 1.3"
    storage_location: "Ephemeral tmpfs in container namespace; strictly memory-backed."
    access_authority: "Ephemeral container runtime process."
    generation: "Generated by Execution Broker upon container creation; injected via read-only tmpfs."
    rotation_policy: "Ephemeral per single tool execution task (lifetime <= task timeout, max 300s)."
    compromise_response: "Immediate container kill, cgroup termination, network namespace purge, and certificate revocation."
    destruction: "Destroyed upon container exit and namespace teardown."

audit_anchoring:
  pipeline:
    - "1. Audit Event Generation"
    - "2. RFC 8785 Canonicalization (JCS)"
    - "3. SHA-256 Hash Chain Linking (H_n = SHA256(H_{n-1} || CanonicalPayload))"
    - "4. Independent Audit Signing (Ed25519 signature over H_n using AUDIT-SIGNING key)"
    - "5. Persistent Append-Only WAL/Database Record"
    - "6. Periodic External Head-Hash Anchor (RFC 3161 Timestamp Token / Transparency Log)"
  hash_chain_algorithm: "SHA-256"
  external_anchor: "RFC-3161 Timestamp Authority or Public Transparency Log (Rekor/Sigstore)"

development_provider_rules:
  allowed_environments:
    - "local_development"
    - "unit_testing"
    - "ci_automation"
  prohibited_destinations:
    - "Git version control"
    - ".env configuration files"
    - "application logs"
    - "LLM prompt contexts"
    - "agent memory graphs"
    - "standard mission data"
    - "Docker container image layers"
  production_readiness: "NOT PRODUCTION SAFE — In-memory ephemeral keys only. Production deployment strictly requires Hardware Security Module (HSM) or Enterprise KMS integration."
