assets:
  - id: "ASSET-KERNEL-STATE"
    name: "Security Kernel Authorization State & Policy Database"
    description: "The authoritative state machine, active mission records, registered capabilities, and policy tables held in the Rust security kernel."
    sensitivity: "CRITICAL"
    trust_zone: "T2"
    owner_component: "COMP-KERNEL"
    integrity_requirements: "Deterministic integrity; immutable state transitions; zero unauthorized mutation."
    confidentiality_requirements: "Restricted to Kernel process memory and private WAL-mode SQLite database."

  - id: "ASSET-CREDENTIALS"
    name: "Target & Service Credential Vault"
    description: "Target authentication material (passwords, private keys, session tokens, API keys) managed by the Credential Broker."
    sensitivity: "CRITICAL"
    trust_zone: "T2"
    owner_component: "COMP-CRED"
    integrity_requirements: "High integrity; tamper detection; audit on all access."
    confidentiality_requirements: "Encrypted at rest; memory-only ephemeral injection; zero raw exposure to LLMs or agents."

  - id: "ASSET-CAPABILITY-TOKENS"
    name: "Ephemeral Capability & Execution Grants"
    description: "Short-lived Ed25519-signed capability tokens binding agent identities to specific allowed operations and scopes."
    sensitivity: "HIGH"
    trust_zone: "T2"
    owner_component: "COMP-AUTH"
    integrity_requirements: "Cryptographically signed; non-forgeable; non-delegable."
    confidentiality_requirements: "Memory-only; never written to disk or logs; never visible in LLM context."

  - id: "ASSET-AUDIT-LOG"
    name: "Cryptographic Audit Ledger & Hash Chain"
    description: "Forward-secure append-only hash chain recording all proposals, normalizations, approvals, dispatches, and emergency actions."
    sensitivity: "CRITICAL"
    trust_zone: "T2"
    owner_component: "COMP-AUDIT"
    integrity_requirements: "Append-only; tamper-evident cryptographic hash chaining (H_n = SHA256(H_n-1 || E_n)); external anchoring."
    confidentiality_requirements: "Internal security audit access only; redaction of raw secret material."

  - id: "ASSET-EVIDENCE-STORE"
    name: "Immutable Evidence Artifact Store"
    description: "Raw scanner outputs, HTTP captures, PCAP files, and screenshots collected during mission execution."
    sensitivity: "HIGH"
    trust_zone: "T2"
    owner_component: "COMP-EVID"
    integrity_requirements: "Content-addressed (SHA-256); append-only; immutable after creation."
    confidentiality_requirements: "Mission-isolated; access restricted to owning mission."

  - id: "ASSET-KNOWLEDGE-GRAPH"
    name: "Mission Knowledge Graph"
    description: "Extracted assets, services, observed relationships, and security findings across the mission."
    sensitivity: "MEDIUM"
    trust_zone: "T2"
    owner_component: "COMP-KG"
    integrity_requirements: "Provenance-backed; derived strictly from authenticated evidence; observational only."
    confidentiality_requirements: "Mission-isolated; cross-mission queries strictly rejected."

  - id: "ASSET-LLM-KEYS"
    name: "LLM Provider API Keys & Ingress/Egress Config"
    description: "Authentication secrets for external LLM inference providers (OpenAI, Anthropic) or local inference models."
    sensitivity: "CRITICAL"
    trust_zone: "T3"
    owner_component: "COMP-LLM-GW"
    integrity_requirements: "Configured via secure administrative environment; immutable during mission."
    confidentiality_requirements: "Isolated to LLM Gateway; never exposed to Python agent code or LLM prompts."

  - id: "ASSET-WORKER-ISOLATION"
    name: "Worker Sandbox Containment Profiles"
    description: "Linux rootless container configurations, seccomp profiles, AppArmor/cgroups, and network namespaces."
    sensitivity: "CRITICAL"
    trust_zone: "T4"
    owner_component: "COMP-WORKER"
    integrity_requirements: "Kernel-enforced container profiles; unalterable by sandboxed processes."
    confidentiality_requirements: "Host configuration inaccessible from inside worker sandbox."

  - id: "ASSET-MISSION-SCOPE"
    name: "Mission Authorized Target Scope"
    description: "Operator-defined target allowlists including IPv4/IPv6 CIDRs, domain names, ports, and URL prefixes."
    sensitivity: "CRITICAL"
    trust_zone: "T2"
    owner_component: "COMP-SCOPE"
    integrity_requirements: "Immutable without operator authorization; enforced at proposal, authorization, execution, and socket connect time."
    confidentiality_requirements: "Visible to operator and mission agents; protected against tampering."

  - id: "ASSET-APPROVAL-SEALS"
    name: "Operator Approval Seals & Parameter Hashes"
    description: "Cryptographic binding of human operator approvals to canonical RFC 8785 JSON parameter hashes."
    sensitivity: "CRITICAL"
    trust_zone: "T2"
    owner_component: "COMP-APPROV"
    integrity_requirements: "Exact hash match required at dispatch; parameter mutation completely invalidates approval."
    confidentiality_requirements: "Signed authorization records stored in kernel database."

  - id: "ASSET-CI-PIPELINE"
    name: "CI/CD Security Gates & Baseline Manifest"
    description: "Automated verification workflows, SHA-256 baseline manifests, and GitHub Actions security gates."
    sensitivity: "CRITICAL"
    trust_zone: "T2"
    owner_component: "COMP-CI"
    integrity_requirements: "Pinned action SHAs; minimal token permissions; protected branch rules."
    confidentiality_requirements: "CI secrets protected against fork PR exposure."
