attack_surfaces:
  - id: "SURF-PRESENTATION-API"
    name: "Presentation / UI REST & WebSocket API"
    trust_boundary: "TB-T1-T2"
    protocol: "HTTPS / WSS REST"
    target_component: "COMP-KERNEL"
    exposure: "INTERNAL_CROSS_PLANE"
    description: "API endpoints exposing mission management, proposal review, approval signing, and emergency stop to UI clients."

  - id: "SURF-A2A-MESSAGING"
    name: "Inter-Agent Messaging Bus"
    trust_boundary: "TB-T2-T3"
    protocol: "In-process async channel / Unix domain socket"
    target_component: "COMP-INTEL"
    exposure: "INTERNAL_CROSS_PLANE"
    description: "Message transport facilitating coordination and finding sharing between specialized reasoning agents."

  - id: "SURF-KERNEL-INGESTION"
    name: "Action Normalization & Ingestion Interface"
    trust_boundary: "TB-T2-T3"
    protocol: "Rust typed IPC"
    target_component: "COMP-NORM"
    exposure: "INTERNAL_CROSS_PLANE"
    description: "Entrypoint accepting ActionProposal JSON payloads from agents and converting them into canonical Action structs."

  - id: "SURF-BROKER-DISPATCH"
    name: "Execution Broker Dispatch Channel"
    trust_boundary: "TB-T2-T4"
    protocol: "Rust typed IPC"
    target_component: "COMP-BROKER"
    exposure: "INTERNAL_CROSS_PLANE"
    description: "Dispatch pipeline validating signed execution grants, binding ephemeral credentials, and provisioning worker tasks."

  - id: "SURF-SANDBOX-CONTAINMENT"
    name: "Worker Container Isolation Boundary"
    trust_boundary: "TB-T4-T5"
    protocol: "OCI Runtime / Linux cgroups & seccomp-bpf"
    target_component: "COMP-SANDBOX"
    exposure: "SANDBOX_INTERNAL"
    description: "Operating system isolation mechanisms containing tool execution within rootless unprivileged containers."

  - id: "SURF-NETWORK-EGRESS"
    name: "Network Egress Broker & Destination Resolvers"
    trust_boundary: "TB-T5-T6"
    protocol: "TCP / UDP Socket Layer"
    target_component: "COMP-SCOPE"
    exposure: "EXTERNAL_NETWORK"
    description: "Connection-time IP validator, custom DNS resolver, and HTTP redirect validator governing worker outbound connections."

  - id: "SURF-EVIDENCE-PARSER"
    name: "Evidence Ingestion & Parsing Subsystem"
    trust_boundary: "TB-T6-T2"
    protocol: "File Stream / POSIX Pipe"
    target_component: "COMP-EVID"
    exposure: "INTERNAL_CROSS_PLANE"
    description: "Parsers converting raw tool artifacts (XML, JSON, PCAP, stdout) into structured, typed evidence objects."

  - id: "SURF-LLM-GATEWAY"
    name: "LLM Gateway Ingress / Egress Filter"
    trust_boundary: "TB-T3-T8"
    protocol: "HTTPS REST"
    target_component: "COMP-LLM-GW"
    exposure: "EXTERNAL_NETWORK"
    description: "Interface mediating all LLM prompt transmissions, enforcing data redaction, spend budgets, and completion validation."

  - id: "SURF-TOOL-WRAPPERS"
    name: "Security Tool Wrapper CLI Builders"
    trust_boundary: "TB-T4-T5"
    protocol: "Process Exec / Argument Array"
    target_component: "COMP-WORKER"
    exposure: "SANDBOX_INTERNAL"
    description: "Typed argument builders translating canonical action parameters into allowlisted tool executable invocations."

  - id: "SURF-CI-PIPELINE"
    name: "CI/CD Pipeline & Supply Chain Verification"
    trust_boundary: "TB-CI-T2"
    protocol: "GitHub Actions Workflow"
    target_component: "COMP-CI"
    exposure: "CI_PIPELINE"
    description: "Automated integration workflows, dependency verification, and blocking security gate enforcement."
