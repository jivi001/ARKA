trust_boundaries:
  - id: "TB-T0-T1"
    name: "Operator to Presentation Interface"
    from_zone: "T0"
    to_zone: "T1"
    description: "Boundary between the human operator/reviewer and the ARKA UI/CLI interface."
    crossing_mechanism: "Web session / CLI arguments / local GUI IPC."
    default_posture: "AUTHENTICATED_AND_AUTHORIZED"
    threat_considerations:
      - "Operator credential theft or session hijacking"
      - "Misleading UI representations of proposed action parameters"

  - id: "TB-T1-T2"
    name: "Presentation to Security Kernel Interface"
    from_zone: "T1"
    to_zone: "T2"
    description: "Boundary separating untrusted presentation layer requests from the authoritative Rust Security Kernel."
    crossing_mechanism: "Authenticated REST / WebSocket API with session token or mTLS."
    default_posture: "AUTHENTICATED_AND_AUTHORIZED"
    threat_considerations:
      - "API authentication bypass"
      - "Injection of unsanitized mission parameters"
      - "Rate limit exhaustion"

  - id: "TB-T2-T3"
    name: "Security Kernel to Python Intelligence Plane Interface"
    from_zone: "T2"
    to_zone: "T3"
    description: "Asymmetric boundary separating the authoritative Rust Kernel from untrusted Python reasoning agents."
    crossing_mechanism: "Strictly typed local IPC / Unix domain socket emitting ActionProposals."
    default_posture: "STRICT_UNIDIRECTIONAL_ISOLATION"
    threat_considerations:
      - "Agent attempting direct execution or socket calls to targets"
      - "Forged A2A messages or capability token manipulation"
      - "Rogue agent submitting malicious action parameters"

  - id: "TB-T3-T8"
    name: "Intelligence Plane to External LLM Provider Interface"
    from_zone: "T3"
    to_zone: "T8"
    description: "Boundary governing data flow from local agents to external cloud or local model endpoints."
    crossing_mechanism: "HTTPS egress mediated strictly by the LLM Gateway."
    default_posture: "MINIMAL_POLICY_CONTROLLED_EGRESS"
    threat_considerations:
      - "Exfiltration of mission credentials or sensitive target data in prompts"
      - "Untrusted model completions attempting system prompt overrides"

  - id: "TB-T2-T4"
    name: "Security Kernel to Execution Broker Interface"
    from_zone: "T2"
    to_zone: "T4"
    description: "Boundary between authorization engine and dispatch execution supervisor."
    crossing_mechanism: "Internal typed Rust IPC passing cryptographically verified ExecutionGrants."
    default_posture: "AUTHENTICATED_AND_AUTHORIZED"
    threat_considerations:
      - "Execution dispatch without verified human approval hash"
      - "TOCTOU parameter mutation between authorization and dispatch"

  - id: "TB-T4-T5"
    name: "Execution Broker to Ephemeral Sandbox Containment"
    from_zone: "T4"
    to_zone: "T5"
    description: "Boundary containing security tool execution within isolated, non-root namespaces."
    crossing_mechanism: "Rootless OCI container instantiation (seccomp, AppArmor, cgroups, netns)."
    default_posture: "STRICT_UNIDIRECTIONAL_ISOLATION"
    threat_considerations:
      - "Container escape to host filesystem or host network"
      - "Access to host Docker socket or kernel private storage"
      - "Failure to clean up processes and temporary credentials on exit"

  - id: "TB-T5-T6"
    name: "Sandbox Worker to Authorized Target Network"
    from_zone: "T5"
    to_zone: "T6"
    description: "Boundary governing outbound network traffic from tool workers to target systems."
    crossing_mechanism: "Network socket restricted exclusively to pre-resolved, pinned destination IP and port."
    default_posture: "MINIMAL_POLICY_CONTROLLED_EGRESS"
    threat_considerations:
      - "SSRF to cloud metadata endpoints or private RFC1918 networks"
      - "DNS rebinding shifting target hostname to internal IP"
      - "HTTP redirect following to unapproved destinations"

  - id: "TB-T6-T2"
    name: "Target Content Ingestion to Evidence Store"
    from_zone: "T6"
    to_zone: "T2"
    description: "Boundary where raw, untrusted target outputs are captured and parsed into evidence."
    crossing_mechanism: "Unidirectional worker stream into sandboxed parser, classified before storage."
    default_posture: "VALIDATED_UNTRUSTED_INGESTION"
    threat_considerations:
      - "Parser exploits (buffer overflows, XML entity expansion, ReDoS) crashing kernel"
      - "Malicious payload altering agent instructions or authorization policy"

  - id: "TB-T7-T3"
    name: "External Web / OSINT Ingestion Interface"
    from_zone: "T7"
    to_zone: "T3"
    description: "Boundary ingesting public Internet data (DNS, whois, web records) into intelligence plane."
    crossing_mechanism: "OSINT broker via sandboxed fetcher and schema-validated evidence ingestion."
    default_posture: "VALIDATED_UNTRUSTED_INGESTION"
    threat_considerations:
      - "OSINT content poisoning attempting to hijack mission reasoning"
      - "Automatic scope expansion based on discovered external infrastructure"

  - id: "TB-CI-T2"
    name: "CI/CD Pipeline to Baseline Security Policy"
    from_zone: "CI"
    to_zone: "T2"
    description: "Boundary protecting the integrity of repository security gates, validator, and baseline."
    crossing_mechanism: "Automated GitHub Actions runner evaluating PR changes against trusted baseline manifest."
    default_posture: "FAIL_CLOSED"
    threat_considerations:
      - "PR modifying validator and policy simultaneously to self-authorize weakening"
      - "Compromised third-party GitHub Action leaking deployment tokens"
